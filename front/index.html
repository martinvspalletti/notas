<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestión de Notas</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 40px;
      }
      h1 {
        margin-bottom: 20px;
      }
      form {
        margin-bottom: 20px;
      }
      .table-container {
        max-width: 1000px;
      }
      td input[type="number"] {
        width: 70px;
      }
      .pagination {
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="mb-4">Consulta y Edición de Notas</h1>

      <form id="formulario" class="mb-4">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label for="carrera" class="form-label">Carrera:</label>
            <select id="carrera" class="form-select" required></select>
          </div>
          <div class="col-md-3">
            <label for="anio" class="form-label">Año:</label>
            <select id="anio" class="form-select" required></select>
          </div>
          <div class="col-md-4">
            <label for="curso" class="form-label">Curso:</label>
            <select id="curso" class="form-select" required></select>
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Buscar</button>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <input
              type="text"
              id="filtroDni"
              class="form-control"
              placeholder="Filtrar por DNI..."
            />
          </div>
          <div class="col-md-6 d-flex align-items-end justify-content-end">
            <button id="exportarExcel" class="btn btn-success">
              Exportar a Excel
            </button>
          </div>
        </div>
      </form>

      <div class="table-container">
        <h2 class="mb-3">Notas</h2>
        <table id="tablaNotas" class="table table-striped table-bordered">
          <thead class="table-dark">
            <tr>
              <th>Nombre y Apellido</th>
              <th>DNI</th>
              <th>Primer Cuatrimestre</th>
              <th>Segundo Cuatrimestre</th>
              <th>Nota Final</th>
              <th>Promedio</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>

        <!-- Paginación -->
        <nav aria-label="Navegación de páginas">
          <ul class="pagination" id="paginador"></ul>
        </nav>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
